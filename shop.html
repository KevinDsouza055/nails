<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#FAF7F4"/>
<title>Shop all sets — Komaura Beauty</title>
<meta name="description" content="Shop Komaura's hand-painted soft gel press-on nails. Signature, Bridal and Editorial collections, made slowly in Jodhpur."/>
<link rel="icon" type="image/jpeg" href="assets/pics/komauralogo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@400;500;600&family=Sacramento&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="nav-host"></div>

<main>
  <section class="shop-head" style="padding-bottom:0">
    <div class="container">
      <span class="eyebrow">The collection</span>
      <h1>Every set, <span class="script">handcrafted.</span></h1>
      <p>Browse the full studio. Filter by mood, shape, or price.</p>

      <div class="filters" role="tablist" aria-label="Collections">
        <button class="chip" data-coll="All">All</button>
        <button class="chip" data-coll="Signature">Signature</button>
        <button class="chip" data-coll="Bridal">Bridal</button>
        <button class="chip" data-coll="Editorial">Editorial</button>
      </div>
      <div class="filters" role="tablist" aria-label="Shapes">
        <button class="chip" data-shape="All">All shapes</button>
        <button class="chip" data-shape="Almond">Almond</button>
        <button class="chip" data-shape="Coffin">Coffin</button>
        <button class="chip" data-shape="Oval">Oval</button>
        <button class="chip" data-shape="Square">Square</button>
      </div>

      <div class="shop-bar">
        <span class="count" id="shop-count">—</span>
        <div class="sort-container">
          <span>Sort:</span>
          <select id="sort" aria-label="Sort products">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="rating">Highest rated</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <section style="padding-top:24px">
    <div class="container">
      <div class="product-grid" id="shop-grid"></div>
    </div>
  </section>
</main>

<div id="footer-host"></div>
<script type="module" src="js/shop.js"></script>
</body>
</html>
