<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#FAF7F4"/>
<title>Checkout — Komaura Beauty</title>
<meta name="description" content="Secure checkout. Pay with cards, UPI, or netbanking via Razorpay."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@400;500;600&family=Sacramento&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="nav-host"></div>

<main>
  <section class="page-head" style="text-align:left">
    <div class="container">
      <span class="eyebrow">Checkout</span>
      <h1>Almost <span class="script">yours.</span></h1>
    </div>
  </section>

  <section style="padding-top:16px">
    <div class="container">
      <div class="checkout-grid">
        <form class="checkout-form" id="checkout-form">
          <h3 style="margin-bottom:14px">Contact</h3>
          <div class="field"><label>Full name</label><input type="text" name="name" required autocomplete="name"/></div>
          <div class="field-row">
            <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="email"/></div>
            <div class="field"><label>Phone</label><input type="tel" name="phone" required autocomplete="tel" inputmode="numeric" maxlength="10"/></div>
          </div>

          <h3 style="margin:24px 0 14px">Shipping</h3>
          <div class="field"><label>Address</label><input type="text" name="address" required autocomplete="street-address"/></div>
          <div class="field-row">
            <div class="field"><label>City</label><input type="text" name="city" required autocomplete="address-level2"/></div>
            <div class="field"><label>State</label><input type="text" name="state" required autocomplete="address-level1"/></div>
          </div>
          <div class="field-row">
            <div class="field"><label>PIN code</label><input type="text" name="pin" required inputmode="numeric" maxlength="6" autocomplete="postal-code"/></div>
            <div class="field"><label>Country</label><input type="text" name="country" value="India" disabled/></div>
          </div>

          <button type="submit" id="pay-btn" class="btn btn-primary btn-block" style="margin-top:24px">Pay now</button>
          <p style="font-size:12px;color:var(--mauve);text-align:center;margin-top:12px">Secured by Razorpay · Cards · UPI · Netbanking</p>
        </form>

        <aside class="summary">
          <h3>Your order</h3>
          <div id="summary-items" style="margin-bottom:14px"></div>
          <div class="line"><span>Subtotal</span><span id="sum-sub">—</span></div>
          <div class="line"><span>Shipping</span><span id="sum-ship">—</span></div>
          <div class="line" style="font-family:var(--font-display);font-size:20px;padding-top:14px;margin-top:8px;border-top:1px solid rgba(42,31,31,.08)"><span>Total</span><span id="sum-total">—</span></div>
        </aside>
      </div>
    </div>
  </section>
</main>

<div id="footer-host"></div>
<script type="module" src="js/checkout.js"></script>
</body>
</html>
